<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=420">
  <title>StreamCap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 420px; min-height: 200px; max-height: 520px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; background: #1a1a2e; color: #e0e0e0; overflow-y: auto;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #16213e; border-bottom: 1px solid #0f3460;
      position: sticky; top: 0; z-index: 10;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header-actions { display: flex; gap: 4px; }
    .btn-sm {
      background: #0f3460; color: #e0e0e0; border: none;
      border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px;
    }
    .btn-sm:hover { background: #1a4a8a; }
    .list { padding: 8px; min-height: 80px; }
    .empty { text-align: center; padding: 36px 16px; color: #666; }
    .empty .hint { font-size: 11px; color: #444; margin-top: 4px; }
    .card {
      padding: 10px 12px; margin-bottom: 6px; background: #16213e;
      border-radius: 8px; border: 1px solid #0f3460;
    }
    .card .meta { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .res { font-weight: 700; color: #e94560; font-size: 12px; }
    .card .url-preview {
      font-size: 10px; color: #888; font-family: monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 8px;
    }
    .btn-row { display: flex; gap: 6px; }
    .btn-queue {
      flex: 1; background: #e94560; color: #fff; border: none;
      border-radius: 6px; padding: 7px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .btn-queue:hover { background: #ff6b81; }
    .btn-queue:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
    .page-info {
      padding: 6px 16px; background: #0f3460; font-size: 11px; color: #58a6ff;
      border-bottom: 1px solid #1a4a8a;
    }
    .page-info .page-hint { color: #484f58; margin-left: 8px; font-size: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎬 StreamCap</h1>
    <div class="header-actions">
      <button id="btnLog" class="btn-sm" title="日志">📋</button>
      <button id="btnMgr" class="btn-sm" title="下载管理">📂</button>
      <button id="btnClear" class="btn-sm" title="清空列表">🗑</button>
      <button id="btnRefresh" class="btn-sm" title="刷新">🔄</button>
    </div>
  </div>
  <div id="pageInfo" class="page-info hidden">
    <span id="pageTitleLabel"></span>
    <span class="page-hint">文件名取自网址路径末段</span>
  </div>
  <div class="list" id="list">
    <div class="empty">浏览视频页面后自动嗅探<br><span class="hint">无需手动刷新</span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
