<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>StreamCap - 分片合并导出</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; font-family: system-ui, sans-serif;
    background: #1a1d24; color: #e8eaf0;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #9aa3b2; font-size: 13px; margin: 0 0 20px; }
  .task {
    display: flex; align-items: center; gap: 12px;
    background: #232733; border: 1px solid #323845; border-radius: 8px;
    padding: 12px 16px; margin-bottom: 10px;
  }
  .name { font-size: 14px; word-break: break-all; flex: 1; }
  .status { font-size: 12px; color: #9aa3b2; white-space: nowrap; }
  .btn {
    background: #3b82f6; color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: #2f6fd9; }
  .btn:disabled { opacity: .5; cursor: default; }
  .empty { color: #9aa3b2; font-size: 14px; }
  .bar-wrap { background: #323845; border-radius: 4px; height: 8px; margin-top: 10px; overflow: hidden; }
  .bar { background: #3b82f6; height: 100%; width: 0; transition: width .3s; }
  #status { margin-top: 12px; font-size: 13px; color: #c9d1de; min-height: 20px; white-space: pre-wrap; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
</style>
</head>
<body>
  <h1>🗜️ 分片合并导出</h1>
  <p class="sub">把 OPFS 缓存的分片直接流式合并成文件保存到磁盘（不占内存、不经过 Chrome 下载器，超大文件也稳定）。合并完成后分片保留，可在下载管理里删除任务清理。</p>
  <div id="tasks"></div>
  <div id="status"></div>

<script src="merge.js"></script>
</body>
</html>
